workflows:
  dotnet-maui-android:
    name: .NET MAUI Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - dotnet
      vars:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install .NET SDK and MAUI Workload
        script: |
          # Installation explicite de .NET 8 si non présent
          brew install --cask dotnet-sdk
          # Installation du workload avec les droits administrateur
          sudo dotnet workload install maui --source https://nuget.org
      - name: Build Android
        script: |
          dotnet build -c Release -f net8.0-android
    artifacts:
      - artifacts/android/app/build/outputs/apk/**/*.apk
